name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test libraries
        run: cargo test --workspace --lib
      - name: Test documentation
        run: cargo test --workspace --doc
      - name: Build all targets
        run: cargo build --workspace --all-targets

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            command: cargo check -p nex
          - name: no-default-features
            command: cargo check -p nex --no-default-features
          - name: serde
            command: cargo check -p nex --no-default-features --features serde
          - name: pcap
            command: cargo check -p nex --no-default-features --features pcap
          - name: async
            command: cargo check -p nex --no-default-features --features async
          - name: all-features
            command: cargo check -p nex --all-features

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check feature combination
        run: ${{ matrix.command }}
