[package]
name = "nex-socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cross-platform socket library. Part of nex project. Offers socket-related functionality."
repository = "https://github.com/shellrow/nex"
readme = "../README.md"
keywords = ["network"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
tokio = { workspace = true, features = ["time", "sync", "net", "rt"], optional = true }
libc = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["net", "uio"] }

[features]
default = []
async = ["dep:tokio"]
